<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotus Cup 2k25 - Telemetria & Setup System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 8px;
      display: flex;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      border-radius: 8px;
      padding: 12px;
      backdrop-filter: blur(10px);
      position: relative;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    h1, h2, h3 { 
      font-family: 'Orbitron', sans-serif;
      text-align: center; 
      margin-top: 5px; 
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* CYBER-PUNK THEME */
    body.theme-cyberpunk {
      background-color: #080b10;
      background-image: linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #e0e6ed;
    }
    body.theme-cyberpunk .app-container {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.12);
    }
    body.theme-cyberpunk h1, body.theme-cyberpunk h2, body.theme-cyberpunk h3 { color: #00f0ff; text-shadow: 0 0 12px #00f0ff; }

    /* IRONMAN THEME */
    body.theme-ironman {
      background-color: #050203;
      background-image: radial-gradient(circle at center, rgba(229, 184, 57, 0.08) 0%, transparent 70%), linear-gradient(rgba(229, 184, 57, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(229, 184, 57, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #ffffff;
    }
    body.theme-ironman .app-container {
      background: rgba(92, 0, 3, 0.92);
      border: 2px solid #e5b839;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    body.theme-ironman h1, body.theme-ironman h2, body.theme-ironman h3 { color: #f5d061; text-shadow: 0 0 10px rgba(0,0,0,0.8); }

    .btn {
      font-family: 'Orbitron', sans-serif;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      transition: all 0.2s ease-in-out;
    }
    body.theme-ironman .btn {
      background: linear-gradient(180deg, #fff2bd 0%, #e5b839 40%, #c49618 100%);
      color: #520003;
      border: 2px solid #000000;
      font-weight: 900;
    }
    body.theme-cyberpunk .btn {
      background-color: #0f1522;
      color: #00f0ff;
      border: 1px solid #00f0ff;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background-color: #0f1522;
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #ffffff;
      border-radius: 4px;
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
    }

    .lobby-card {
      background: rgba(15, 21, 34, 0.9);
      border: 1px solid #00f0ff;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.35);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 21, 34, 0.8);
      border: 1px solid #00f0ff;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #00f0ff;
      margin-left: 10px;
    }

    .tyres-deck {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
      background-color: rgba(15, 21, 34, 0.6);
      padding: 8px;
      border-radius: 6px;
    }
    .tyre-card {
      background-color: #0f1522;
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 4px;
      padding: 6px;
      text-align: center;
    }
    .tyre-card.active { border-color: #00f0ff !important; box-shadow: 0 0 10px #00f0ff; }
    
    .laps-container { display: flex; justify-content: center; gap: 6px; }
    .lap-box {
      width: 28px; height: 28px;
      background-color: #0f1522;
      color: #cbd5e1;
      border: 1px solid #2e3d52;
      border-radius: 3px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }
    .lap-box.marked { background-color: #00f0ff !important; color: #000 !important; font-weight: 900 !important; }
    .lap-box.clickable { cursor: pointer; }

    .board-row {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 4px;
      margin-bottom: 12px; padding: 6px;
      border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 6px; width: 100%;
    }
    .board-side { display: flex; align-items: flex-end; gap: 4px; }
    .boxes-container { display: flex; gap: 2px; }

    .box {
      width: 30px; height: 34px;
      font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 3px; background: #0f1522; color: #00ffcc; border: 1px solid #00f0ff;
    }
    .box.x-red { background: rgba(255, 0, 85, 0.2) !important; color: #ff0055 !important; border: 1px solid #ff0055 !important; font-weight: 900; }
    .box.clickable { cursor: pointer; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #080b10; padding: 20px; border-radius: 8px; max-width: 450px; width: 92%; text-align: center; border: 1px solid #00f0ff;
    }
  </style>
</head>
<body class="theme-ironman">

<div class="app-container">

  <!-- 1. HOME MENU -->
  <div id="screen-home" class="screen active">
    <h1>LOTUS CUP 2K25</h1>
    <p style="text-align: center; font-family: 'Orbitron'; font-size: 0.85rem;">TELEMETRIA & SETUP SYSTEM</p>
    <div style="max-width: 400px; margin: 0 auto;">
      <select id="theme-select" onchange="changeTheme(this.value)">
        <option value="ironman" selected>Iron-Man Theme</option>
        <option value="cyberpunk">Cyber-Punk Theme</option>
      </select>
      <button class="btn" onclick="showScreen('screen-new-game')">Crea Nuova Partita</button>
      <button class="btn" onclick="openJoinGameScreen()">Unisciti a una Partita</button>
      <button class="btn" onclick="loadSavedGameModal()">Riprendi Partita</button>
    </div>
  </div>

  <!-- 2. CREA PARTITA -->
  <div id="screen-new-game" class="screen">
    <h2>Crea Nuova Partita</h2>
    <div style="max-width: 500px; margin: 0 auto;">
      <label>Nome Gara / Circuito:</label>
      <input type="text" id="input-circuit" placeholder="es. Monza, Spa...">
      <label>Nome Pilota / Host:</label>
      <input type="text" id="input-host" placeholder="Il tuo nome...">
      <label>Meteo Iniziale:</label>
      <select id="input-weather">
        <option value="sun">â˜€ï¸ Sole Fisso</option>
        <option value="rain">ðŸŒ§ï¸ Pioggia Fissa</option>
        <option value="var_dry" selected>ðŸŒ¤ï¸ Variabile Asciutto</option>
        <option value="var_wet">ðŸŒ§ï¸ Variabile Bagnato</option>
      </select>
      <button class="btn" onclick="createGame()">Genera Stanza</button>
      <button class="btn" onclick="showScreen('screen-home')">Indietro</button>
    </div>
  </div>

  <!-- 3. UNISCITI -->
  <div id="screen-join-game" class="screen">
    <h2>Unisciti a una Partita</h2>
    <div style="max-width: 500px; margin: 0 auto;">
      <div id="lobbies-list-container"></div>
      <div id="join-form-section" style="display:none;">
        <label>Inserisci il tuo Nome Pilota:</label>
        <input type="text" id="input-player-name">
        <button class="btn" onclick="joinGame()">Entra nella Gara</button>
      </div>
      <button class="btn" onclick="showScreen('screen-home')">Indietro</button>
    </div>
  </div>

  <!-- 4. DASHBOARD GARA -->
  <div id="screen-setup" class="screen">
    <div class="sheet-header">
      <div>
        <h3 style="margin:0; display:flex; align-items:center;">
          <span id="display-circuit">CIRCUITO</span>
          <div id="weather-badge" class="weather-badge">
            <span id="weather-icon">â˜€ï¸</span> <small id="weather-text">Sole</small>
          </div>
        </h3>
        <small id="display-meta">-</small>
      </div>
      <div><strong>ROOM: <span id="display-code">0000</span></strong></div>
    </div>

    <div style="margin-bottom: 15px;">
      <button id="btn-start-config" class="btn" onclick="startConfiguration()">Inizia Configurazione (13 Punti)</button>
      <button id="btn-lock-setup" class="btn" onclick="officializeSetup()" style="display:none;" disabled>Inizia Gara</button>
      <div id="race-controls" style="display:none; gap:8px;">
        <button id="btn-toggle-edit" class="btn" onclick="toggleRaceEdit()">Sblocca Edit</button>
        <button id="btn-pitstop-action" class="btn" onclick="handlePitStopButtonClick()" style="display:none;">Pit Stop</button>
        <button id="btn-weather-test" class="btn" onclick="openWeatherModal()" style="display:none;">Controllo Meteo</button>
      </div>
    </div>

    <div class="tyres-deck" id="tyres-deck-container"></div>
    <div id="budget-bar" style="display:none; text-align:center; font-family:'Orbitron'; margin-bottom:10px;">Punti Setup: <span id="budget-count">13</span>/13</div>

    <!-- COMPONENTI PRINCIPALI -->
    <div class="board-row">
      <div class="board-side"><div class="boxes-container" id="row-tyres"></div></div>
      <div class="board-side"><div class="boxes-container" id="row-body"></div></div>
    </div>
    <div class="board-row">
      <div class="board-side"><div class="boxes-container" id="row-brakes"></div></div>
      <div style="text-align:center;"><small>KERS</small><div id="box-kers" class="box" onclick="interactKers()"></div></div>
      <div class="board-side"><div class="boxes-container" id="row-engine"></div></div>
    </div>
    <div class="board-row">
      <div class="board-side"><div class="boxes-container" id="row-fuel"></div></div>
      <div style="text-align:center;"><small>ALETTONE</small><div id="box-wing" class="box" onclick="toggleWing()"></div></div>
      <div class="board-side"><div class="boxes-container" id="row-suspension"></div></div>
    </div>

    <div style="margin-top:15px;">
      <h3>Piloti in Gara</h3>
      <div id="opponents-list-items"></div>
    </div>
  </div>

</div>

<!-- MODALI -->
<div id="modal-load-game" class="modal">
  <div class="modal-content">
    <h3>Riprendi Partita</h3>
    <div id="load-games-list-container" style="max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
    <button class="btn" onclick="closeModal('modal-load-game')">Annulla</button>
  </div>
</div>

<div id="modal-pitstop-confirm" class="modal">
  <div class="modal-content">
    <h3>Entrata ai Box</h3>
    <button class="btn" onclick="confirmEnterPitStop()">Conferma</button>
    <button class="btn" onclick="closeModal('modal-pitstop-confirm')">Annulla</button>
  </div>
</div>

<div id="modal-weather" class="modal">
  <div class="modal-content">
    <h3>Controllo Meteo</h3>
    <button class="btn" onclick="processWeatherCheck('sun')">Tiro: Sole</button>
    <button class="btn" onclick="processWeatherCheck('rain')">Tiro: Pioggia</button>
    <button class="btn" onclick="closeModal('modal-weather')">Annulla</button>
  </div>
</div>

<script>
  let gameState = {
    code: null, circuit: '', host: '', date: '', playerName: '', playerId: '',
    theme: 'ironman', isSetupMode: false, isRaceMode: false, isEditingAllowed: false, isPitStopActive: false,
    weather: 'var_dry', budget: 13, selectedTyre: 'Prime', 
    tyreLaps: { Prime: [], Option: [], Intermedie: [], Pioggia: [] },
    wingActive: false, kersState: 'empty',
    baseValues: { tyres: 4, brakes: 2, fuel: 2, body: 2, engine: 2, suspension: 1 },
    allocations: { tyres: 0, brakes: 0, fuel: 0, body: 0, engine: 0, suspension: 0 },
    markedUsages: { tyres: [], brakes: [], fuel: [], body: [], engine: [], suspension: [] },
    workshopUsages: []
  };

  let inspectingPilotId = null, myPlayerId = '', selectedRoomCodeForJoin = null, remoteLobbiesCache = {};

  function changeTheme(themeName) {
    document.body.className = `theme-${themeName}`;
    gameState.theme = themeName;
    const select = document.getElementById('theme-select');
    if (select) select.value = themeName;
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function saveGameState() {
    if (!gameState.code || !gameState.playerId) return;
    let lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    if (!lobbies[gameState.code]) {
      lobbies[gameState.code] = { code: gameState.code, circuit: gameState.circuit, host: gameState.host, weather: gameState.weather, pilots: {} };
    }
    lobbies[gameState.code].pilots[gameState.playerId] = { id: gameState.playerId, name: gameState.playerName, data: gameState };
    localStorage.setItem('lotus_lobbies', JSON.stringify(lobbies));
    localStorage.setItem(`lotus_game_${gameState.code}_${gameState.playerId}`, JSON.stringify(gameState));
  }

  function pushSchedaToServer() {
    saveGameState();
    if (typeof socket !== 'undefined' && socket.connected) {
      socket.emit('aggiorna-scheda', gameState);
    }
  }

  function createGame() {
    const circuit = document.getElementById('input-circuit').value.trim() || 'Monza';
    const host = document.getElementById('input-host').value.trim() || 'Pilota 1';
    const weather = document.getElementById('input-weather').value;
    myPlayerId = '01';
    gameState.code = Math.floor(1000 + Math.random() * 9000);
    gameState.circuit = circuit;
    gameState.host = host;
    gameState.playerName = host;
    gameState.playerId = myPlayerId;
    gameState.weather = weather;
    saveGameState();
    initSetupScreen();
  }

  function openJoinGameScreen() {
    let lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    const container = document.getElementById('lobbies-list-container');
    container.innerHTML = '';
    Object.keys(lobbies).forEach(code => {
      let l = lobbies[code];
      container.innerHTML += `<div class="lobby-card" onclick="selectLobbyCard('${code}', '${l.circuit}')"><span>${l.circuit} (Host: ${l.host})</span></div>`;
    });
    showScreen('screen-join-game');
  }

  function selectLobbyCard(code, circuitName) {
    selectedRoomCodeForJoin = code;
    document.getElementById('join-form-section').style.display = 'block';
  }

  function joinGame() {
    const code = selectedRoomCodeForJoin;
    const name = document.getElementById('input-player-name').value.trim();
    if (!code || !name) return;
    let lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    myPlayerId = '02';
    gameState.code = code;
    gameState.circuit = lobbies[code].circuit;
    gameState.host = lobbies[code].host;
    gameState.weather = lobbies[code].weather || 'var_dry';
    gameState.playerName = name;
    gameState.playerId = myPlayerId;
    saveGameState();
    initSetupScreen();
  }

  function loadSavedGameModal() {
    let lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    let container = document.getElementById('load-games-list-container');
    container.innerHTML = '';
    Object.keys(lobbies).forEach(code => {
      Object.keys(lobbies[code].pilots).forEach(pId => {
        let p = lobbies[code].pilots[pId];
        container.innerHTML += `<button class="btn" onclick="loadPilot('${code}', '${pId}')">${p.name} - ${lobbies[code].circuit}</button>`;
      });
    });
    document.getElementById('modal-load-game').style.display = 'flex';
  }

  function loadPilot(code, pId) {
    gameState = JSON.parse(localStorage.getItem(`lotus_game_${code}_${pId}`));
    myPlayerId = pId;
    changeTheme(gameState.theme || 'ironman');
    closeModal('modal-load-game');
    initSetupScreen();
  }

  function initSetupScreen() {
    document.getElementById('display-circuit').innerText = gameState.circuit;
    document.getElementById('display-code').innerText = gameState.code;
    document.getElementById('display-meta').innerText = `Pilota: ${gameState.playerName}`;
    
    document.getElementById('btn-start-config').style.display = gameState.isRaceMode ? 'none' : (gameState.isSetupMode ? 'none' : 'block');
    document.getElementById('btn-lock-setup').style.display = gameState.isSetupMode ? 'block' : 'none';
    document.getElementById('race-controls').style.display = gameState.isRaceMode ? 'flex' : 'none';
    document.getElementById('budget-bar').style.display = gameState.isSetupMode ? 'block' : 'none';

    updateWeatherUI();
    renderTyreDeck();
    renderBoard();
    renderOpponentsList();
    showScreen('screen-setup');
  }

  function updateWeatherUI() {
    const text = document.getElementById('weather-text');
    if (gameState.weather === 'sun') text.innerText = 'Sole';
    else if (gameState.weather === 'rain') text.innerText = 'Pioggia';
    else text.innerText = 'Variabile';
  }

  function startConfiguration() {
    gameState.isSetupMode = true;
    initSetupScreen();
  }

  function officializeSetup() {
    if (gameState.budget > 0) return;
    gameState.isSetupMode = false;
    gameState.isRaceMode = true;
    gameState.isEditingAllowed = false;
    initSetupScreen();
    pushSchedaToServer();
  }

  function toggleRaceEdit() {
    gameState.isEditingAllowed = !gameState.isEditingAllowed;
    document.getElementById('btn-toggle-edit').innerText = gameState.isEditingAllowed ? 'Blocca Edit' : 'Sblocca Edit';
    document.getElementById('btn-pitstop-action').style.display = gameState.isEditingAllowed ? 'block' : 'none';
    document.getElementById('btn-weather-test').style.display = (gameState.isEditingAllowed && gameState.weather.includes('var')) ? 'block' : 'none';
    renderBoard();
    if (!gameState.isEditingAllowed) pushSchedaToServer();
  }

  function handlePitStopButtonClick() {
    if (!gameState.isPitStopActive) {
      document.getElementById('modal-pitstop-confirm').style.display = 'flex';
    } else {
      gameState.isPitStopActive = false;
      document.getElementById('btn-pitstop-action').innerText = 'Pit Stop';
      renderBoard();
      pushSchedaToServer();
    }
  }

  function confirmEnterPitStop() {
    gameState.isPitStopActive = true;
    document.getElementById('btn-pitstop-action').innerText = 'Ripartenza Box';
    closeModal('modal-pitstop-confirm');
    renderBoard();
    saveGameState();
  }

  function openWeatherModal() { document.getElementById('modal-weather').style.display = 'flex'; }
  function processWeatherCheck(val) { gameState.weather = val; updateWeatherUI(); closeModal('modal-weather'); saveGameState(); }

  function renderTyreDeck() {
    const container = document.getElementById('tyres-deck-container');
    container.innerHTML = '';
    ['Prime', 'Option', 'Intermedie', 'Pioggia'].forEach(t => {
      let isSelected = gameState.selectedTyre === t;
      let lapsHtml = [1, 2, 3].map(lap => {
        let isMarked = gameState.tyreLaps[t].includes(lap);
        let clickable = (!gameState.isRaceMode || gameState.isSetupMode || (gameState.isRaceMode && gameState.isPitStopActive && isSelected && lap !== 1));
        return `<div class="lap-box ${isMarked ? 'marked' : ''} ${clickable ? 'clickable' : ''}" ${clickable ? `onclick="toggleTyreLap('${t}', ${lap})"` : ''}>${lap}</div>`;
      }).join('');

      container.innerHTML += `<div class="tyre-card ${isSelected ? 'active' : ''}">
        <button class="btn" style="padding:4px; margin:0 0 6px 0; font-size:0.8rem;" onclick="selectTyre('${t}')">${t}</button>
        <div class="laps-container">${lapsHtml}</div>
      </div>`;
    });
  }

  function selectTyre(t) {
    if (gameState.isSetupMode || gameState.isPitStopActive) {
      gameState.selectedTyre = t;
      renderTyreDeck();
      saveGameState();
    }
  }

  function toggleTyreLap(type, lap) {
    let list = gameState.tyreLaps[type];
    let pos = list.indexOf(lap);
    if (pos > -1) list.splice(pos, 1);
    else list.push(lap);
    renderTyreDeck();
    saveGameState();
  }

  function renderBoard() {
    ['tyres', 'brakes', 'fuel', 'body', 'engine', 'suspension'].forEach(comp => {
      const container = document.getElementById(`row-${comp}`);
      container.innerHTML = '';
      const totalBoxes = (comp === 'tyres') ? 10 : 6;
      const totalPoints = gameState.baseValues[comp] + gameState.allocations[comp];

      for (let i = 0; i < totalBoxes; i++) {
        const box = document.createElement('div');
        box.className = 'box';

        if (gameState.isSetupMode && i >= gameState.baseValues[comp] && i < totalPoints) {
          box.innerText = '1';
          box.classList.add('clickable');
          box.onclick = () => removeBudgetPoint(comp);
        } else if (gameState.isSetupMode && i >= totalPoints) {
          box.innerText = '';
          if (gameState.budget > 0) {
            box.classList.add('clickable');
            box.onclick = () => addBudgetPoint(comp);
          }
        } else if (i < totalPoints) {
          box.innerText = '1';
        } else {
          box.innerText = '';
        }

        if (gameState.isRaceMode && gameState.markedUsages[comp].includes(i)) {
          box.innerText = 'X';
          box.classList.add('x-red');
        }

        if (gameState.isRaceMode && (gameState.isEditingAllowed || gameState.isPitStopActive)) {
          box.classList.add('clickable');
          box.onclick = () => handleComponentClick(comp, i);
        }

        container.appendChild(box);
      }
    });

    // KERS e Alettone
    const kersBox = document.getElementById('box-kers');
    kersBox.innerText = gameState.kersState === 'charged' ? 'âš¡' : (gameState.kersState === 'damaged' ? 'X' : '');
    const wingBox = document.getElementById('box-wing');
    wingBox.innerText = gameState.wingActive ? 'ìœ™' : '';

    document.getElementById('budget-count').innerText = gameState.budget;
    if (gameState.budget === 0) document.getElementById('btn-lock-setup').removeAttribute('disabled');
  }

  function addBudgetPoint(comp) {
    if (gameState.budget > 0) { gameState.allocations[comp]++; gameState.budget--; renderBoard(); }
  }

  function removeBudgetPoint(comp) {
    if (gameState.allocations[comp] > 0) { gameState.allocations[comp]--; gameState.budget++; renderBoard(); }
  }

  function toggleWing() { if (gameState.isSetupMode) { gameState.wingActive = !gameState.wingActive; renderBoard(); } }
  function interactKers() { if (gameState.isRaceMode && gameState.isEditingAllowed) { gameState.kersState = gameState.kersState === 'charged' ? 'empty' : 'charged'; renderBoard(); saveGameState(); } }

  // GESTIONE DELLE X CON LE REGOLE SPECULARI PER SINISTRA E DESTRA
  function handleComponentClick(comp, clickedIndex) {
    if (inspectingPilotId !== null) return;
    
    const rightAligned = ['body', 'engine', 'suspension'];
    const isRight = rightAligned.includes(comp);
    const totalBoxes = (comp === 'tyres') ? 10 : 6;
    const totalPoints = gameState.baseValues[comp] + gameState.allocations[comp];
    const markedList = gameState.markedUsages[comp];
    const isClickedMarked = markedList.includes(clickedIndex);

    if (isClickedMarked) {
      if (!isRight) {
        markedList.sort((a, b) => a - b);
        markedList.shift();
      } else {
        markedList.sort((a, b) => b - a);
        markedList.shift();
      }
    } else {
      let targetIndex = -1;
      if (!isRight) {
        for (let i = totalPoints - 1; i >= 0; i--) { 
          if (!markedList.includes(i)) { targetIndex = i; break; } 
        }
      } else {
        for (let i = totalBoxes - totalPoints; i < totalBoxes; i++) {
          if (!markedList.includes(i)) { targetIndex = i; break; }
        }
      }

      if (targetIndex !== -1) {
        markedList.push(targetIndex);
      }
    }

    renderBoard();
    saveGameState();
  }

  function renderOpponentsList() {
    let list = document.getElementById('opponents-list-items');
    list.innerHTML = `<div style="padding:6px; background:rgba(0,0,0,0.2); border-radius:4px;">${gameState.playerName} (Tu)</div>`;
  }

  function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

  const socket = io('https://lotus-cup-server.onrender.com');
  socket.on('connect', () => { if (gameState.code) pushSchedaToServer(); });
</script>
