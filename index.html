<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lotus Cup 2k25 - Telemetria & Setup System</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    /* Stili invariati per mantenere l'aspetto */
    * { box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background-color: #050203; color: #ffffff; margin: 0; padding: 8px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 950px; background: rgba(92, 0, 3, 0.92); border: 2px solid #e5b839; border-radius: 8px; padding: 12px; }
    .screen { display: none; }
    .screen.active { display: block; }
    h1, h2 { font-family: 'Orbitron', sans-serif; text-align: center; color: #f5d061; }
    .btn { background: linear-gradient(180deg, #fff2bd 0%, #e5b839 40%, #c49618 100%); color: #520003; border: 2px solid #000000; padding: 14px 20px; font-weight: 900; border-radius: 6px; cursor: pointer; width: 100%; margin: 10px 0; }
    .lobby-card { background: rgba(15, 21, 34, 0.9); border: 1px solid #00f0ff; padding: 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .lobby-card.selected { border: 2px solid #ffb700; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; background-color: #0f1522; border: 1px solid #00f0ff; color: #ffffff; border-radius: 4px; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Schermata HOME -->
  <div id="screen-home" class="screen active">
    <h1>LOTUS CUP 2K25</h1>
    <button class="btn" onclick="showScreen('screen-new-game')">Crea Nuova Partita</button>
    <button class="btn" onclick="openJoinGameScreen()">Unisciti a una Partita</button>
  </div>

  <!-- Schermata CREA -->
  <div id="screen-new-game" class="screen">
    <h2>Crea Nuova Partita</h2>
    <input type="text" id="input-circuit" placeholder="Nome Circuito...">
    <input type="text" id="input-host" placeholder="Tuo Nome...">
    <select id="input-weather">
      <option value="sun">Sole Fisso</option>
      <option value="rain">Pioggia Fissa</option>
    </select>
    <button class="btn" onclick="createGame()">Genera Partita</button>
    <button class="btn" onclick="showScreen('screen-home')">Indietro</button>
  </div>

  <!-- Schermata JOIN -->
  <div id="screen-join-game" class="screen">
    <h2>Unisciti a una Partita</h2>
    <div id="lobbies-list-container"></div>
    <div id="join-form-section" style="display:none;">
      <input type="text" id="input-player-name" placeholder="Il tuo nome...">
      <button class="btn" onclick="joinGame()">Entra</button>
    </div>
    <button class="btn" onclick="showScreen('screen-home')">Indietro</button>
  </div>
</div>

<script>
  let gameState = { code: null, circuit: '', host: '', playerName: '', playerId: '' };
  let remoteLobbiesCache = {};
  const socket = io('https://lotus-cup-server.onrender.com');

  // LOGICA DI SINCRONIZZAZIONE MIGLIORATA
  socket.on('ricevi-scheda', (data) => {
    // Ogni volta che riceviamo una scheda, aggiorniamo la nostra lista locale di stanze
    let lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    
    if (!lobbies[data.code]) {
      lobbies[data.code] = { code: data.code, circuit: data.circuit, host: data.host, date: data.date, pilots: {} };
    }
    
    lobbies[data.code].pilots[data.playerId] = { name: data.playerName, status: 'Attivo' };
    localStorage.setItem('lotus_lobbies', JSON.stringify(lobbies));

    // Se l'utente Ã¨ nella schermata join, aggiorniamo la vista
    if (document.getElementById('screen-join-game').classList.contains('active')) {
      renderLobbiesListHTML(lobbies);
    }
  });

  function openJoinGameScreen() {
    const lobbies = JSON.parse(localStorage.getItem('lotus_lobbies') || '{}');
    renderLobbiesListHTML(lobbies);
    showScreen('screen-join-game');
  }

  function renderLobbiesListHTML(lobbiesObj) {
    const container = document.getElementById('lobbies-list-container');
    container.innerHTML = '';
    Object.keys(lobbiesObj).forEach(code => {
      let l = lobbiesObj[code];
      let div = document.createElement('div');
      div.className = 'lobby-card';
      div.innerHTML = `<div><strong>${l.circuit}</strong><br><small>Room: ${l.code}</small></div>`;
      div.onclick = () => {
        selectedRoomCodeForJoin = code;
        document.getElementById('join-form-section').style.display = 'block';
      };
      container.appendChild(div);
    });
  }

  function createGame() {
    gameState = {
      code: Math.floor(1000 + Math.random() * 9000),
      circuit: document.getElementById('input-circuit').value,
      host: document.getElementById('input-host').value,
      playerName: document.getElementById('input-host').value,
      playerId: 'host_' + Date.now()
    };
    saveAndSync();
    alert("Partita creata! La stanza Ã¨ ora visibile agli altri.");
  }

  function saveAndSync() {
    localStorage.setItem(`lotus_game_${gameState.code}`, JSON.stringify(gameState));
    socket.emit('aggiorna-scheda', gameState);
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>
</body>
</html>
